version: '3.8'

services:

  db:
    image: mysql:latest
    container_name: funchase_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  django:
    build:
      context: ./backend/ServerBackend
    volumes:
      - ./backend/ServerBackend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./backend/ServerBackend/.env

  react:
    build:
      context: ./frontend
    volumes:
      - ./frontend/build:/usr/share/nginx/html

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./nginx-site.conf:/etc/nginx/conf.d/nginx-site.conf
      - ./certificates:/etc/nginx/ssl
      - ./frontend/build:/usr/share/nginx/html
      - ./backend/ServerBackend/ServerBackend/media:/usr/share/nginx/html/media
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - django
      - react

  celery:
    build:
      context: ./backend/ServerBackend
    command: celery -A ServerBackend worker -l info
    volumes:
      - ./backend/ServerBackend:/app
    depends_on:
      - django
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    env_file:
      - ./backend/ServerBackend/.env


  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  daphne:
    build:
      context: ./backend/ServerBackend
    command: daphne -b 0.0.0.0 -p 8001 ServerBackend.asgi:application
    depends_on:
      - django
      - db
    ports:
      - "8001:8001"
    environment:
      - DJANGO_SETTINGS_MODULE=ServerBackend.settings
    env_file:
      - ./backend/ServerBackend/.env


volumes:
  mysql_data:
