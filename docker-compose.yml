version: '3.8'

services:
  django:
    build:
      context: ./backend/ServerBackend
    volumes:
      - ./backend/ServerBackend:/app
    ports:
      - "8000:8000"
    env_file: #not used?
        - ./backend/ServerBackend/.env

  react:
    build:
      context: ./frontend
    volumes:
      - ./frontend/build:/usr/share/nginx/html
        #ports: NO NEED TO BIND HERE
        #- "80:80" #80:80 or 3000:80 or 3000:3000 ??

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx-site.conf:/etc/nginx/nginx.conf
      - ./certificates:/etc/nginx/ssl
      - ./frontend/build:/usr/share/nginx/html
      - ./backend/ServerBackend/ServerBackend/static:/usr/share/nginx/html/static
      - ./backend/ServerBackend/ServerBackend/media:/usr/share/nginx/html/media
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - django
      - react
