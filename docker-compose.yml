version: '3.8'

services:
  django:
    build:
      context: ./backend/ServerBackend
    volumes:
      - ./backend/ServerBackend:/app
    ports:
      - "8000:8000"
    env_file: #not used?
        - ./backend/ServerBackend/.env

  react:
    build:
      context: ./frontend
    volumes:
      - ./frontend/build:/usr/share/nginx/html
        #ports: NO NEED TO BIND HERE
        #- "80:80" #80:80 or 3000:80 or 3000:3000 ??

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./nginx-site.conf:/etc/nginx/conf.d/nginx-site.conf
      - ./certificates:/etc/nginx/ssl
      - ./frontend/build:/usr/share/nginx/html
      #- ./backend/ServerBackend/ServerBackend/static:/usr/share/nginx/html/static
      - ./backend/ServerBackend/ServerBackend/media:/usr/share/nginx/html/media
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - django
      - react

  celery:
    build:
      context: ./backend/ServerBackend
    command: celery -A ServerBackend worker -l info
    volumes:
      - ./backend/ServerBackend:/app
    depends_on:
      - django
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  daphne:
    build:
      context: ./backend/ServerBackend  # Ensure it builds correctly for your backend
    command: daphne -b 0.0.0.0 -p 8001 ServerBackend.asgi:application
    depends_on:
      - django
    ports:
      - "8001:8001"
    environment:
      - DJANGO_SETTINGS_MODULE=ServerBackend.settings

